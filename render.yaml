# render.yaml (Versi yang sudah diperbaiki)

services:
  # 1. Konfigurasi Web Service (Aplikasi Laravel)
  - type: web
    name: koperasi-kosgoro-app
    env: php
    region: singapore
    plan: free
    branch: main
    
    buildCommand: |
      composer install --no-interaction --no-dev --prefer-dist --optimize-autoloader
      npm install
      npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
      php artisan migrate --force
      
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT

  # 2. Konfigurasi Database (Tipe sudah diperbaiki)
  - type: p_mysql # <-- PERBAIKAN: dari 'mysql' menjadi 'p_mysql'
    name: kosgoro-db 
    region: singapore
    plan: free
    databaseName: koperasi_kosgoro
    mysqlVersion: 8

# 3. Konfigurasi Environment Variables (Referensi sudah diperbaiki)
envVarGroups:
  - name: laravel-env
    envVars:
      - key: APP_URL
        fromService:
          type: web
          name: koperasi-kosgoro-app
          property: url
      - key: APP_KEY
        generateValue: true
      
      # Referensi koneksi database (sudah diperbaiki)
      - key: DB_HOST
        fromService:
          type: p_mysql # <-- PERBAIKAN
          name: kosgoro-db
          property: host
      - key: DB_DATABASE
        fromService:
          type: p_mysql # <-- PERBAIKAN
          name: kosgoro-db
          property: database
      - key: DB_USERNAME
        fromService:
          type: p_mysql # <-- PERBAIKAN
          name: kosgoro-db
          property: user
      - key: DB_PASSWORD
        fromService:
          type: p_mysql # <-- PERBAIKAN
          name: kosgoro-db
          property: password
      
      # Kunci-kunci statis
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: mysql
      - key: DB_PORT
        value: 3306