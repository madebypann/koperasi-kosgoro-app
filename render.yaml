# render.yaml

services:
  # Web Service untuk aplikasi Laravel Anda
  - type: web
    name: koperasi-kosgoro-app
    env: php
    region: singapore
    plan: free
    branch: main
    buildCommand: |
      composer install --no-interaction --no-dev --prefer-dist --optimize-autoloader
      npm install
      npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
      php artisan migrate --force
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT

  # Database untuk aplikasi Anda (sudah diubah ke MySQL)
  - type: mysql # <-- UBAH INI (dari psql ke mysql)
    name: kosgoro-db-mysql # Anda bisa menamainya apa saja
    region: singapore
    plan: free
    databaseName: koperasi_kosgoro # <-- UBAH INI (sesuai nama database Anda)
    mysqlVersion: 8 # <-- UBAH INI (Render mendukung versi 8)

# Konfigurasi Environment Variables
envVarGroups:
  - name: laravel-env
    envVars:
      - key: APP_URL
        fromService:
          type: web
          name: koperasi-kosgoro-app
          property: url
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      
      # Koneksi ke database MySQL
      - key: DB_CONNECTION
        value: mysql # <-- UBAH INI
      - key: DB_HOST
        fromService:
          type: mysql # <-- UBAH INI
          name: kosgoro-db-mysql # Sesuaikan dengan nama service database di atas
          property: host
      - key: DB_PORT
        fromService:
          type: mysql # <-- UBAH INI
          name: kosgoro-db-mysql
          property: port
      - key: DB_DATABASE
        fromService:
          type: mysql # <-- UBAH INI
          name: kosgoro-db-mysql
          property: database
      - key: DB_USERNAME
        fromService:
          type: mysql # <-- UBAH INI
          name: kosgoro-db-mysql
          property: user
      - key: DB_PASSWORD
        fromService:
          type: mysql # <-- UBAH INI
          name: kosgoro-db-mysql
          property: password