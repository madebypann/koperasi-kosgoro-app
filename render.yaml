# render.yaml (Versi Final menggunakan PostgreSQL)

services:
  # 1. Konfigurasi Web Service (Aplikasi Laravel Anda)
  - type: web
    name: koperasi-kosgoro-app
    env: php 
    region: singapore 
    plan: free 
    branch: main 
    
    # Perintah build tidak berubah
    buildCommand: |
      composer install --no-interaction --no-dev --prefer-dist --optimize-autoloader
      npm install
      npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
      php artisan migrate --force
      
    # Perintah start tidak berubah
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT

    # Environment variables untuk aplikasi web
    envVars:
      # Koneksi ke database PostgreSQL di bawah
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromService:
          type: psql
          name: kosgoro-db-postgres
          property: host
      - key: DB_PORT
        fromService:
          type: psql
          name: kosgoro-db-postgres
          property: port
      - key: DB_DATABASE
        fromService:
          type: psql
          name: kosgoro-db-postgres
          property: database
      - key: DB_USERNAME
        fromService:
          type: psql
          name: kosgoro-db-postgres
          property: user
      - key: DB_PASSWORD
        fromService:
          type: psql
          name: kosgoro-db-postgres
          property: password

      # Variabel aplikasi lainnya
      - key: APP_URL
        fromService:
          type: web
          name: koperasi-kosgoro-app
          property: url
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr

# 2. Konfigurasi Database PostgreSQL (Ini didukung di Blueprint)
databases:
  - name: kosgoro-db-postgres # Nama internal untuk database
    region: singapore
    plan: free
    # Anda tidak perlu menentukan nama database, Render akan membuatnya otomatis
    # dan memasukkannya ke env var DB_DATABASE